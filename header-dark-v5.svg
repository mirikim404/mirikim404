<svg width="100%" viewBox="0 0 1510 310" xmlns="http://www.w3.org/2000/svg" role="img" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Miri's GitHub 헤더 배너 (실제 경향 반영)</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">GitHub 다크모드 배경색과 동일한 배경에 제목, 소속, 실제 개발 경향을 담은 헤더</desc>
<rect x="0" y="0" width="1500" height="300" fill="#212830" style="fill:rgb(33, 40, 48);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<line x1="20" y1="180" x2="1480" y2="180" stroke="#3D444D" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgb(61, 68, 77);color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="20" y="115" font-family="Georgia, 'Noto Serif KR', serif" font-size="72" font-weight="400" fill="#E6EDF3" style="fill:rgb(230, 237, 243);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, &quot;Noto Serif KR&quot;, serif;font-size:72px;font-weight:400;text-anchor:start;dominant-baseline:auto">Miri's GitHub</text>
<text x="20" y="150" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#8B949E" letter-spacing="1" style="fill:rgb(139, 148, 158);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Helvetica, Arial, sans-serif;font-size:18px;font-weight:400;text-anchor:start;dominant-baseline:auto">Computer Science Student · Ewha Womans University</text>
<text x="20" y="222" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9FA6AD" style="fill:rgb(159, 166, 173);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Helvetica, Arial, sans-serif;font-size:17px;font-weight:400;text-anchor:start;dominant-baseline:auto">배운 내용을 직접 만들어보며 익히는 걸 좋아해서,</text>
<text x="20" y="252" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9FA6AD" style="fill:rgb(159, 166, 173);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Helvetica, Arial, sans-serif;font-size:17px;font-weight:400;text-anchor:start;dominant-baseline:auto">Java 기반 백엔드 개발과 팀 프로젝트로 실력을 쌓고 있습니다.</text>
